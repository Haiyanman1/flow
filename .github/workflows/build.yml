# Builds the Windows installer. Tauri can't cross-compile, so this is how a
# Windows build gets made without a Rust/Visual Studio toolchain on the PC.
#
#   - Push a tag like `v0.2.0`  → builds, then attaches the installer to a
#                                 GitHub Release of that name.
#   - "Run workflow" in the Actions tab → builds and uploads the installer as
#                                 a workflow artifact (no release).
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release on tag pushes

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Same gate as a local build: types, frontend tests, timer-engine tests.
      - run: npx tsc --noEmit
      - run: npm test
      - run: cargo test
        working-directory: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only tag pushes get a release; manual runs just build.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Flow {0}', github.ref_name) || '' }}
          releaseBody: |
            Windows installer for Flow. The build is unsigned, so Windows SmartScreen
            will warn on first launch — choose **More info → Run anyway**.
          releaseDraft: false
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: Flow-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
